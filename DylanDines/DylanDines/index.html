<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dylan Dines</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#efe9d8; --paper:#fbf8ef; --ink:#000; --muted:#5b564a; --rule:#d9d1bc; --edge:#d8cfb8; --ph:#e8e0cb;
  --serif:'Newsreader',Georgia,'Times New Roman',serif; --sans:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#15130f;--paper:#1f1c17;--ink:#f4efe2;--muted:#a59f8f;--rule:#3a352b;--edge:#2e2a22;--ph:#2b271f}
}
:root[data-theme="dark"]{--bg:#15130f;--paper:#1f1c17;--ink:#f4efe2;--muted:#a59f8f;--rule:#3a352b;--edge:#2e2a22;--ph:#2b271f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.stage{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:32px 16px}
.book{position:relative;width:min(1040px,100%);display:grid;grid-template-columns:1fr 1fr;background:var(--paper);min-height:660px;
  box-shadow:0 2px 0 var(--edge),0 4px 0 var(--paper),0 5px 0 var(--edge),0 8px 0 var(--paper),0 9px 0 var(--edge),0 34px 50px -24px rgba(0,0,0,.35)}
.book:not(.closed)::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:70px;margin-left:-35px;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(0,0,0,.09) 46%,rgba(0,0,0,.16) 50%,rgba(0,0,0,.09) 54%,transparent)}
.book.closed{grid-template-columns:1fr;width:min(460px,100%);min-height:640px}
.page{position:relative;padding:clamp(24px,4vw,52px) clamp(24px,4vw,52px) 64px;display:flex;flex-direction:column}
.pn{position:absolute;bottom:24px;font-family:var(--sans);font-size:13px;color:var(--muted)}
.l .pn{left:clamp(24px,4vw,52px)} .r .pn{right:clamp(24px,4vw,52px)}
.book[data-turn=next] .page.r{transform-origin:left center;animation:turnN .55s ease both}
.book[data-turn=prev] .page.l{transform-origin:right center;animation:turnP .55s ease both}
@keyframes turnN{from{transform:perspective(1400px) rotateY(-70deg);opacity:.2}to{transform:none;opacity:1}}
@keyframes turnP{from{transform:perspective(1400px) rotateY(70deg);opacity:.2}to{transform:none;opacity:1}}

/* cover */
.cover{margin:18px;padding:40px 28px 32px;border:1px solid var(--ink);outline:1px solid var(--ink);outline-offset:-7px;align-items:center;text-align:center;justify-content:space-between}
.cover h1{font-weight:500;font-size:clamp(44px,9vw,64px);line-height:1.02;letter-spacing:-.015em;margin:56px 0 18px}
.cover p{margin:0;color:var(--muted);font-style:italic;font-size:19px}
.cover .by{font-family:var(--sans);font-size:14px;color:var(--muted);font-style:normal}
.open{display:inline-flex;align-items:center;gap:12px;background:none;border:1px solid var(--ink);border-radius:999px;padding:10px 12px 10px 22px;font-family:var(--sans);font-size:15px;font-weight:500;margin-top:28px}
.open svg{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--paper);padding:7px}
.open:hover svg{transform:translateX(3px)} .open svg{transition:transform .2s}

/* text pages */
h2{font-weight:500;font-size:clamp(28px,3.6vw,38px);line-height:1.1;letter-spacing:-.01em;margin:0 0 10px}
h3{font-family:var(--sans);font-weight:600;font-size:15px;margin:22px 0 8px}
.meta{font-family:var(--sans);font-size:14px;color:var(--muted);margin:0 0 14px}
.rating{display:flex;align-items:baseline;gap:8px;padding:10px 0;border-block:1px solid var(--rule);margin-bottom:18px}
.rating b{font-size:30px;font-weight:500;line-height:1}
.rating span{font-family:var(--sans);font-size:14px;color:var(--muted)}
.page p{margin:0 0 12px;max-width:62ch}
ul.dishes{list-style:none;margin:0;padding:0}
ul.dishes li{padding:6px 0;border-bottom:1px solid var(--rule);font-size:16px}
ul.dishes li i{color:var(--muted)}
.verdict{font-style:italic;font-size:19px;margin-top:20px!important}

/* photos */
.photos{display:grid;grid-template-columns:1fr 1fr;gap:12px;height:100%}
.ph{background:var(--ph);border:1px solid var(--rule);display:grid;place-items:center;text-align:center;color:var(--muted);font-family:var(--sans);font-size:13px;padding:12px;width:100%;height:100%;object-fit:cover;min-height:0}
.ph.big{grid-column:1/-1;min-height:340px}
.ph.sm{min-height:170px}
.photos .sm:last-child:nth-child(2){grid-column:1/-1}
.cap{font-size:14px;font-style:italic;color:var(--muted);margin:10px 0 0!important}

/* contents */
.toc{list-style:none;margin:8px 0 0;padding:0}
.toc li{border-bottom:1px solid var(--rule)}
.toc button{width:100%;background:none;border:0;text-align:left;display:grid;grid-template-columns:1fr auto;gap:16px;padding:14px 0;align-items:baseline}
.toc button:hover strong{text-decoration:underline}
.toc strong{font-weight:500;font-size:21px}
.toc small{font-family:var(--sans);font-size:13px;color:var(--muted);display:block}
.toc .p{font-family:var(--sans);font-size:14px;color:var(--muted)}
.links a{color:var(--ink)}

/* nav */
.nav{display:flex;align-items:center;gap:10px;max-width:100%}
.arrow{width:42px;height:42px;border-radius:50%;border:1px solid var(--ink);background:none;display:grid;place-items:center;flex:none}
.arrow:disabled{opacity:.25;cursor:default}
.arrow svg{width:18px;height:18px}
.nums{display:flex;gap:4px;overflow-x:auto;padding:4px}
.nums button{background:none;border:0;border-bottom:2px solid transparent;font-family:var(--sans);font-size:14px;padding:6px 10px;color:var(--muted);white-space:nowrap}
.nums button[aria-current=page]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.nums button:hover{color:var(--ink)}

@media (max-width:780px){
  .book{grid-template-columns:1fr;min-height:0}
  .book:not(.closed)::after{display:none}
  .page.l{padding-bottom:36px}
  .ph.big{min-height:300px}
  .photos{height:auto}
}
@media (prefers-reduced-motion:reduce){.book .page{animation:none!important}.open svg{transition:none}}
</style>
</head>
<body>
<main class="stage" id="stage">
  <article class="book closed" id="book" aria-live="polite"></article>
  <nav class="nav" aria-label="Page navigation">
    <button class="arrow" id="prev" aria-label="Previous page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="nums" id="nums"></div>
    <button class="arrow" id="next" aria-label="Next page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
  </nav>
</main>
<script>
/* ================= EDIT HERE ================= */
const SITE={title:'Dylan Dines',tagline:'Restaurant reviews',author:'Dylan Dias'};

/* Where your photos live. '' = in the same folder as this file. Use 'images/' if they are in a folder called images. */
const PHOTO_DIR='';

/* Each review:
   photos = the 3 photos on the review's first spread (1 large, 2 small).
   more   = any extra photos. Every 6 extra photos add one new spread (2 pages of photos) after the review.
   To add a restaurant, copy one block, paste it below the last one (keep the comma), and change the text. */
const REVIEWS=[
 {name:'Leitao',meta:'Modern American, Brooklyn. $$$. Visited September 2026',score:'8.5',
  body:['A small room with a loud kitchen and a menu that stays out of its own way. Everything arrived hot, and the pacing was unhurried without feeling slow.','The cooking leans on good butter and good timing. Not every plate was a surprise, but none of them missed.'],
  dishes:[['Roast chicken for two','crackling skin, worth the wait'],['Charred cabbage','smoky, a little sweet'],['Brown butter cake','the one to save room for']],
  verdict:'A neighborhood place that cooks like it has something to prove.',
  photos:['IMG_5556.jpeg','IMG_5555.jpeg','IMG_2713.jpeg'],more:[]},

 {name:'Galo',meta:'Japanese, East Village. $$. Visited August 2026',score:'8.0',
  body:['Twelve seats, one broth, and a line that moves faster than it looks. The tonkotsu is rich without turning heavy.','Noodles had real bite. The only letdown was a soft egg that had gone a touch too far.'],
  dishes:[['Tonkotsu ramen','deep, milky, balanced'],['Pork gyoza','crisp lacy edges'],['Yuzu soda','sharp and clean']],
  verdict:'Come hungry and early. It is worth the stool.',
  photos:['IMG_5629.jpeg','IMG_5623.jpeg','IMG_2714.jpeg'],more:[]},

 {name:'Theodora',meta:'Spanish, Lower East Side. $$. Visited October 2026',score:'9.0',
  body:['The kind of dinner that turns into three hours without anyone checking the time. Plates are meant for sharing and the staff steers you well.','Everything tasted like it came from somewhere specific, and the sherry list is a quiet pleasure.'],
  dishes:[['Gambas al ajillo','garlic, chile, bread to mop it up'],['Tortilla española','soft center, the real thing'],['Basque cheesecake','burnished top, custardy middle']],
  verdict:'My favorite meal of the year so far.',photos:['IMG_1338.jpeg', 'IMG_5611.jpeg', 'IMG_5606.jpeg',],more:[]},

 {name:'Court Street Grocers',meta:'Sandwiches, Carroll Gardens. $$. Visited October 2026',score:'9.0',
  body:['The kind of dinner that turns into three hours without anyone checking the time. Plates are meant for sharing and the staff steers you well.','Everything tasted like it came from somewhere specific, and the sherry list is a quiet pleasure.'],
  dishes:[['Gambas al ajillo','garlic, chile, bread to mop it up'],['Tortilla española','soft center, the real thing'],['Basque cheesecake','burnished top, custardy middle']],
  verdict:'My favorite meal of the year so far.',photos:[],more:[]},

 {name:'Brown Bag Sandwich Co.',meta:'Sandwiches, Lower East Side. $$. Visited October 2026',score:'9.0',
  body:['The kind of dinner that turns into three hours without anyone checking the time. Plates are meant for sharing and the staff steers you well.','Everything tasted like it came from somewhere specific, and the sherry list is a quiet pleasure.'],
  dishes:[['Gambas al ajillo','garlic, chile, bread to mop it up'],['Tortilla española','soft center, the real thing'],['Basque cheesecake','burnished top, custardy middle']],
  verdict:'My favorite meal of the year so far.',photos:[],more:[]},

 {name:'Estela ❁',meta:'Spanish, Lower East Side. $$. Visited October 2026',score:'9.0',
  body:['The kind of dinner that turns into three hours without anyone checking the time. Plates are meant for sharing and the staff steers you well.','Everything tasted like it came from somewhere specific, and the sherry list is a quiet pleasure.'],
  dishes:[['Gambas al ajillo','garlic, chile, bread to mop it up'],['Tortilla española','soft center, the real thing'],['Basque cheesecake','burnished top, custardy middle']],
  verdict:'My favorite meal of the year so far.',
  photos:['IMG_5899.jpeg', 'E360BCB5-0DCB-47A0-91C4-8EC63D3AD35F.JPG'],
  more:[] /* put extra photo names here, like ['IMG_5900.jpeg','IMG_5901.jpeg'] */}
];
/* ============================================= */

/* Build the list of spreads: cover, contents, each review (plus its extra photo spreads), closing */
const PAGES=[{t:'cover'},{t:'toc'}];
REVIEWS.forEach(r=>{
  r.at=PAGES.length; PAGES.push({t:'review',r});
  const m=r.more||[];
  for(let k=0;k<m.length;k+=6) PAGES.push({t:'photos',r,p:m.slice(k,k+6)});
});
PAGES.push({t:'end'});
const N=PAGES.length;
let cur=0;
const $=id=>document.getElementById(id);
const lp=i=>i*2, rp=i=>i*2+1;
const range=i=>i===0?'Cover':lp(i)+'–'+rp(i);
const src=f=>/^(https?:|data:|\/)/.test(f)?f:PHOTO_DIR+f;
const ph=(f,cls,label)=>f
  ?`<img class="ph ${cls}" src="${src(f)}" alt="${label}">`
  :`<div class="ph ${cls}" role="img" aria-label="Placeholder for a photo of ${label}"><span>Your photo of ${label}</span></div>`;
const photoPage=(list,label)=>`<div class="photos">${list.map((f,k)=>ph(f,k===0?'big':'sm',label)).join('')}</div>`;
const chevron='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>';

/* If a photo file can't be found, show its name so you can fix the spelling */
document.addEventListener('error',e=>{
  const t=e.target;
  if(t.tagName==='IMG'&&t.classList.contains('ph')){
    const d=document.createElement('div'), s=document.createElement('span');
    d.className=t.className; s.textContent='Can’t find '+t.getAttribute('src'); d.appendChild(s); t.replaceWith(d);
  }
},true);

function spread(i){
  const P=PAGES[i];
  if(P.t==='cover') return `<section class="page cover"><div><h1>${SITE.title}</h1><p>${SITE.tagline}</p></div><div><button class="open" data-go="1">Open the book ${chevron}</button></div><div class="by">By ${SITE.author}</div></section>`;
  if(P.t==='toc'){
    const toc=REVIEWS.map(r=>`<li><button data-go="${r.at}"><span><strong>${r.name}</strong><small>${r.meta.split('.')[0]}</small></span><span class="p">p. ${lp(r.at)}</span></button></li>`).join('');
    return `<section class="page l"><h2>Welcome</h2><p>I am a student from New Jersey, and every Tuesday and Thursday this semester I study in the city.</p><p>So I decided to rate and review the restaurants I’ve eaten at.</p><p>This is just something I’m doing for fun, to see if it goes anywhere. Over the next pages you will find photos and a review of each place I’ve eaten. All my reviews are also on my Instagram the day I go, and on Beli. Links are on the last page.</p><p>Dylan</p><span class="pn">${lp(1)}</span></section>
    <section class="page r"><h2>Contents</h2><ul class="toc">${toc}</ul><span class="pn">${rp(1)}</span></section>`;
  }
  if(P.t==='end') return `<section class="page l"><h2>Still hungry?</h2><p>New reviews are added after every meal worth writing about. Follow along to see them first.</p><span class="pn">${lp(i)}</span></section>
    <section class="page r"><h2>Find me</h2><p class="links">Instagram: <a href="#" onclick="return false">@yourhandle</a><br>Beli: <a href="#" onclick="return false">Your profile</a><br>Email: <a href="#" onclick="return false">hello@example.com</a></p><p><button class="open" data-go="0">Back to the cover ${chevron}</button></p><span class="pn">${rp(i)}</span></section>`;
  if(P.t==='photos'){
    const a=P.p.slice(0,3), b=P.p.slice(3);
    return `<section class="page l">${photoPage(a,P.r.name)}<span class="pn">${lp(i)}</span></section>
    <section class="page r">${b.length?photoPage(b,P.r.name):''}<span class="pn">${rp(i)}</span></section>`;
  }
  const r=P.r, p=r.photos||[];
  const first=[0,1,2].map(k=>ph(p[k],k?'sm':'big',r.dishes[k]?r.dishes[k][0].toLowerCase():r.name)).join('');
  return `<section class="page l"><div class="photos">${first}</div><span class="pn">${lp(i)}</span></section>
  <section class="page r"><h2>${r.name}</h2><p class="meta">${r.meta}</p><div class="rating"><b>${r.score}</b><span>out of 10</span></div>${r.body.map(t=>`<p>${t}</p>`).join('')}<h3>What I ordered</h3><ul class="dishes">${r.dishes.map(d=>`<li>${d[0]}, <i>${d[1]}</i></li>`).join('')}</ul><p class="verdict">${r.verdict}</p><span class="pn">${rp(i)}</span></section>`;
}
function render(dir){
  const b=$('book');
  b.className='book'+(cur===0?' closed':'');
  if(dir) b.dataset.turn=dir; else delete b.dataset.turn;
  b.innerHTML=spread(cur);
  $('nums').innerHTML=Array.from({length:N},(_,i)=>`<button data-go="${i}"${i===cur?' aria-current="page"':''}>${range(i)}</button>`).join('');
  $('prev').disabled=cur===0; $('next').disabled=cur===N-1;
  const cp=$('nums').querySelector('[aria-current]'); if(cp&&cp.scrollIntoView) cp.scrollIntoView({block:'nearest',inline:'center'});
  try{history.replaceState(null,'','#'+cur)}catch(e){}
}
function go(i){ i=Math.max(0,Math.min(N-1,i)); if(i===cur) return; const d=i>cur?'next':'prev'; cur=i; render(d); window.scrollTo({top:0}); }
document.addEventListener('click',e=>{const t=e.target.closest('[data-go]'); if(t) go(+t.dataset.go);});
$('prev').onclick=()=>go(cur-1); $('next').onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(cur+1); if(e.key==='ArrowLeft')go(cur-1);});
let sx=null; const st=$('stage');
st.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
st.addEventListener('touchend',e=>{if(sx===null)return; const dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>70) go(cur+(dx<0?1:-1)); sx=null;});
try{const h=parseInt(location.hash.slice(1),10); if(h>=0&&h<N) cur=h;}catch(e){}
render();
</script>
</body>
</html>
